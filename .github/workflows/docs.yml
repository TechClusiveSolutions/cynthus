name: Docs

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "templates/**"
      - "tools/**/*.md"
      - "*.md"
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "templates/**"
      - "tools/**/*.md"
      - "*.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            docs/engineering-standards.md
            docs/adr/**/*.md
            docs/architecture/**/*.md
            templates/**/*.md
            tools/TESTING.md
            tools/FIX-LOG.md
            README.md

  # Branch protection requires a check named "test". ci.yml ignores documentation-only changes, so that check would
  # never report and would block the merge. This job satisfies it without running anything.
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changed - the test suite in ci.yml does not apply."

name: CI

# One workflow owns every required check so the names are unambiguous: `lint`, `test` and `docs-lint`.
# A job whose input did not change is skipped (a skipped required check counts as passing), so documentation-only
# pull requests are not blocked by the Python jobs and code-only pull requests are not blocked by markdownlint.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "tools/**"
              - "templates/**"
              - "pyproject.toml"
              - ".github/workflows/ci.yml"
            docs:
              - "**/*.md"
              - "docs/**"
              - ".markdownlint-cli2.jsonc"
              - ".github/workflows/ci.yml"
              - ".github/scripts/check_markdown.py"

  lint:
    needs: changes
    # If change detection itself fails, run everything: a skipped required check would otherwise pass silently.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run ruff
        run: uvx ruff@0.15.20 check .

  # This repository holds documentation, templates and the cross-repository tooling scripts.
  test:
    needs: changes
    # If change detection itself fails, run everything: a skipped required check would otherwise pass silently.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scripts compile
        run: python -m compileall -q tools
      - name: Bootstrap script copies the template
        run: |
          mkdir -p /tmp/target/.git
          python tools/bootstrap_repo.py /tmp/target
          test -f /tmp/target/.github/workflows/ci.yml

  docs-lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check screen-reader rules and links
        run: python3 .github/scripts/check_markdown.py
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
